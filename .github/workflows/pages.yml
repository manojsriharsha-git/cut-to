# Publishes the website in website/ to GitHub Pages:
#   https://manojsriharsha-git.github.io/cut-to/
# Turn it on once: repository Settings -> Pages -> Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/images/**", "resources/icons/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together
        run: |
          mkdir -p _site/assets/fonts
          cp website/index.html _site/
          cp docs/images/*.png _site/assets/
          cp resources/icons/cutto.png docs/brand/logo-sheet.png _site/assets/
          cp resources/fonts/courierprime/CourierPrime-{Regular,Bold,Italic}.ttf _site/assets/fonts/
          cp resources/fonts/archivoblack/ArchivoBlack-Regular.ttf _site/assets/fonts/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
